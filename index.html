<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<title>Borç Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* yazarken (klavye açıkken) yüzen düğmeler yazı kutusunu kapatmasın */
body.typing .ai-fab,body.typing .fab{display:none!important}
/* Layout: one phone-width column; sticky header, fixed bottom tab bar; summary first, detail opens in bottom sheets */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E2E9E5; --ink:#12201B; --ink-2:#46564F; --ink-3:#74847D; --line:#D4DDD8;
  --accent:#0A6B58; --accent-2:#0E8A71; --on-accent:#FFFFFF; --accent-soft:#D3ECE4;
  --warn:#975800; --warn-soft:#FAEBD2; --bad:#B3261E; --bad-soft:#F9E0DD; --good:#16794A; --good-soft:#DCF1E5;
  --scrim:rgba(10,20,16,.45);
  --shadow:0 1px 2px rgba(18,32,27,.06),0 8px 24px rgba(18,32,27,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1A; --sunk:#1C2924; --ink:#E4EDE9; --ink-2:#AEBDB6; --ink-3:#7F9089; --line:#27362F;
  --accent:#3CC5A0; --accent-2:#5BD6B4; --on-accent:#05211A; --accent-soft:#163A30;
  --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1A17; --good:#6BD69B; --good-soft:#153826;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1A; --sunk:#1C2924; --ink:#E4EDE9; --ink-2:#AEBDB6; --ink-3:#7F9089; --line:#27362F;
  --accent:#3CC5A0; --accent-2:#5BD6B4; --on-accent:#05211A; --accent-soft:#163A30;
  --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1A17; --good:#6BD69B; --good-soft:#153826;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--ink-3);font-size:12.5px}
.sync{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.sync.cloud{background:var(--accent-soft);color:var(--accent)}

/* sections */
section.view{display:flex;flex-direction:column;gap:18px}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.block-h h2{font-size:17px;font-weight:700}
.block-h span{font-size:12.5px;color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

.hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{opacity:.85}
.hero .big{font-family:var(--f-display);font-size:clamp(34px,10vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero-sub{font-size:13.5px;opacity:.85}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-accent) 22%,transparent);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--on-accent);border-radius:99px}
.hero-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;opacity:.9;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .sub{font-size:12px;color:var(--ink-3)}
.tile .sub b{color:var(--warn);font-weight:600}
button.tile{border:0;text-align:left;width:100%;cursor:pointer;color:inherit}
button.tile:hover,button.tile:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.hero-hit{all:unset;display:flex;flex-direction:column;gap:8px;cursor:pointer;border-radius:12px}
.hero-hit:focus-visible,.hero-link:focus-visible{outline:2px solid var(--on-accent);outline-offset:3px}
.hero-link{background:none;border:0;color:inherit;font:inherit;padding:2px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--on-accent) 45%,transparent);cursor:pointer}
.hero-ai{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--on-accent);color:var(--accent);cursor:pointer}
.ai-fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(148px + env(safe-area-inset-bottom,0px));
  height:48px;padding:0 16px 0 12px;border-radius:16px;border:0;background:var(--surface);color:var(--accent);display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:var(--shadow)}
.ai-fab svg{width:22px;height:22px}
@media (min-width:640px){.ai-fab{right:calc(50% - 280px)}}
.why-f{font-size:12.5px;color:var(--ink-3);display:block;margin-top:2px}

.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:600;white-space:nowrap}
.datebox{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--sunk);padding:5px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--f-display);font-size:18px}
.datebox span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent-2);border-radius:99px}
.bar span.warn{background:var(--warn)} .bar span.bad{background:var(--bad)}
.neg{color:var(--good)}

.acc-card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%;box-shadow:var(--shadow)}
.acc-top{display:flex;align-items:center;gap:10px}
.acc-top .main{flex:1;min-width:0}
.acc-top .t{font-weight:700}
.acc-top .s{font-size:12.5px;color:var(--ink-3)}
.acc-nums{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.acc-nums .big{font-family:var(--f-display);font-size:22px;font-weight:700}
.acc-nums .side{font-size:12.5px;color:var(--ink-2);text-align:right}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sunk);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.link{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline}

.empty{background:var(--surface);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--ink-2)}
.empty ol{margin:0;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* quick assistant bar */
.ask{display:flex;gap:8px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 14px;align-items:center;box-shadow:var(--shadow)}
.ask input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.ask button{border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);width:42px;height:42px;display:grid;place-items:center;flex:none}
.hint{font-size:12.5px;color:var(--ink-3);margin:-8px 4px 0}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px;display:flex;flex-direction:column;gap:8px}
.msg.pending{color:var(--ink-3)}
.applied{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;white-space:normal}
.applied div{font-size:13px;display:flex;gap:8px;align-items:baseline}
.applied .via{font-size:11.5px;color:var(--ink-3)}
.applied.undone div{text-decoration:line-through;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;color:var(--ink-2)}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;padding-top:8px;background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.ai-note{font-size:12px;color:var(--ink-3);padding:0 4px}

/* filter */
.filter{display:flex;gap:8px;align-items:center}
.filter select{flex:1;min-width:0}
.day-h{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:6px 4px 0;text-transform:capitalize}
.del{border:0;background:none;color:var(--ink-3);font-size:12px;padding:2px 0}
.del.armed{color:var(--bad);font-weight:700}

/* tab bar + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;white-space:nowrap;color:var(--ink-3);border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg{width:26px;height:26px}
@media (min-width:640px){.fab{right:calc(50% - 280px)}}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;font-size:20px;min-width:0}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:12px;flex:none}
.kv{background:var(--surface);border-radius:var(--r)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv span{color:var(--ink-2)}
.kv b{text-align:right}
.note{font-size:12.5px;color:var(--ink-3);margin:0}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink-3);border-top:0;font-size:12px}
th:first-child,td:first-child{text-align:left}
tr.paid td{color:var(--ink-3)}
tr.next td{background:var(--accent-soft)}

form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px}
.fld small{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;color:var(--ink-3);text-align:center;font-weight:600}
.cal-d{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px}
.cal-d b{font-size:14px;font-variant-numeric:tabular-nums}
.cal-d small{font-size:10px;color:var(--ink-2);white-space:nowrap}
.cal-d.rest{background:var(--sunk)}
.cal-d.off{background:var(--bad-soft);border-color:var(--bad)} .cal-d.off small{color:var(--bad);font-weight:700}
.cal-d.leave{background:var(--accent-soft)}
.cal-d.extra{background:var(--good-soft);border-color:var(--good)}
.cal-d.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-d[disabled]{cursor:default;opacity:.75}
.cal-d.leave small{color:var(--accent);font-weight:700}
.cal-d small{font-variant-numeric:tabular-nums}
.cal-y{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:560px){.cal-y{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cal-m{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.cal-m b{font-size:13px}
.cal-m .o{font-size:13px;font-weight:700;color:var(--accent)}
.cal-m .i{font-size:11.5px;color:var(--good);min-height:14px}
.cal-m.off{background:var(--bad-soft);border-color:var(--bad)} .cal-m.off .o{color:var(--bad)}
.cal-m.today{outline:2px solid var(--accent);outline-offset:1px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--accent-2);font-weight:700;padding:0}
/* yıllık gelir-gider grafiği: gelir ve gider iki kategorik renk; beklenen kısım aynı rengin açık tonu + çizgili doku */
:root{--c-inc:#0E8A71;--c-exp:#6457D1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-inc:#22A383;--c-exp:#887DE8}}
:root[data-theme="dark"]{--c-inc:#22A383;--c-exp:#887DE8}
.yr-read{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;min-height:40px;font-size:13px;color:var(--ink-2)}
.yr-read b{font-family:var(--f-display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.yr-read .m{font-weight:700;color:var(--ink);min-width:80px}
.yr-chart{position:relative;height:190px;margin:10px 0 0 38px}
.yr-grid{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.yr-grid span{position:absolute;right:calc(100% + 6px);top:-7px;font-size:10px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.yr-grid.zero{border-top-color:var(--ink-3)}
.yr-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.yr-col{border:0;background:none;padding:0 1px;display:flex;align-items:flex-end;justify-content:center;gap:2px;cursor:pointer;border-radius:6px 6px 0 0;position:relative;height:100%}
.yr-col:hover,.yr-col:focus-visible,.yr-col.sel{background:var(--sunk)}
.yr-bar{width:min(9px,42%);display:flex;flex-direction:column-reverse;gap:2px;height:100%}
.yr-bar i{display:block;width:100%;flex:0 0 auto}
.yr-bar i:last-child{border-radius:4px 4px 0 0}
.yr-bar .inc{background:var(--c-inc)} .yr-bar .exp{background:var(--c-exp)}
.yr-bar .plan{opacity:.4;background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--surface) 3px 4.5px)}
.yr-mon{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin:6px 0 0 38px;font-size:10.5px;color:var(--ink-3);text-align:center}
.yr-mon .now{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.yr-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.yr-leg span{display:inline-flex;align-items:center;gap:6px}
.yr-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.yr-tab{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.yr-tab th,.yr-tab td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
.yr-tab th:first-child,.yr-tab td:first-child{text-align:left}
.yr-tab th{color:var(--ink-3);font-weight:600}
details.yr-more summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;padding:8px 0}
</style>
</head>

<script>
(() => {
"use strict";
// ---------- constants ----------
const TAX = 1.30; // KKDF %15 + BSMV %15, faiz tutarı üzerinden
const KIND = {harcama:"Harcama",nakit:"Nakit avans",odeme:"Ödeme",iade:"İade",faiz:"Faiz / ücret",cekim:"Çekim / harcama",yatirma:"Para yatırma",puan_ekle:"Puan kazanımı",puan_kullan:"Puan kullanımı",gelir:"Gelir",gider:"Gider"};
const KINDS_BY_TYPE = {kart:["harcama","nakit","odeme","iade","faiz","puan_ekle","puan_kullan"],kmh:["cekim","yatirma","faiz"],kredi:["odeme"],nakit:["gelir","gider"]};
const DEBIT = new Set(["harcama","nakit","faiz","cekim"]);

const CATS = ["Market","Akaryakıt","Fatura","Yeme-içme","Giyim","Sağlık","Ulaşım","Araç","Eğlence","Eğitim","Ev","Teknoloji","Gelir",
  "Garden Terrace Otel","Sera İşletmesi","AFK E-Ticaret","Proje/Taahhüt","Malzeme Alımı","Maaş/Personel","Çek/Senet","Cari","Diğer"];

  ["Ziraat Bankası",["ziraat","bankkart"]],["İş Bankası",["is bank","isbank","is bankasi","maximum"]],

// ---------- state ----------
const S = {accounts:[], tx:[], chat:[], view:"ozet", filterAcc:"all", mode:"local", sheet:null, armed:null, aiNote:"", rates:null, recurring:[], salary:{settings:null, days:{}}, hotel:{name:"Garden Terrace Otel", elec:{}, charges:[], payments:[]}, bills:[], units:[], memory:[], extraCats:[], people:[]};
// defterdeki ek listeler: mülk/proje, asistanın öğrendikleri, kullanıcının eklediği kategoriler, kişiler
const EXTRA_KEYS = ["units", "memory", "extraCats", "people", "learned"];
const pickExtras = src => Object.fromEntries(EXTRA_KEYS.map(k => [k, JSON.parse(JSON.stringify((src && src[k]) || []))]));
function applyExtras(src) { for (const k of EXTRA_KEYS) S[k] = JSON.parse(JSON.stringify((src && src[k]) || [])); for (const c of S.extraCats) if (!CATS.includes(c)) CATS.splice(CATS.length - 1, 0, c); }
let ledgerRef = null, txCol = null, digestRef = null, digestChecked = false, sampleP = null, sampleOff = false;
const LS = "borc-defteri-v1", LS_CHAT = "borc-defteri-chat", LS_VIEW = "borc-defteri-view";

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
const dateInMonth = (y, m, day) => { const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); };
const addMonths = (d, n) => dateInMonth(d.getFullYear(), d.getMonth() + n, d.getDate());
const lastStatement = (sd, T) => { let d = dateInMonth(T.getFullYear(), T.getMonth(), sd); if (d > T) d = dateInMonth(T.getFullYear(), T.getMonth() - 1, sd); return d; };
function stmtCount(sd, from, to) { // hesap kesim tarihleri: from < s <= to
  let s = dateInMonth(from.getFullYear(), from.getMonth(), sd);
  if (s <= from) s = dateInMonth(from.getFullYear(), from.getMonth() + 1, sd);
  let c = 0; while (s <= to && c < 400) { c++; s = dateInMonth(s.getFullYear(), s.getMonth() + 1, sd); }
  return c;
}
const nfC = new Intl.NumberFormat("tr-TR", {style:"currency", currency:"TRY", minimumFractionDigits:2, maximumFractionDigits:2});
const nfC0 = new Intl.NumberFormat("tr-TR", {style:"currency", currency:"TRY", maximumFractionDigits:0});
const money = n => nfC.format(Math.abs(n) < 0.005 ? 0 : n);
const money0 = n => nfC0.format(Math.round(n) || 0);
const fmtD = d => d.toLocaleDateString("tr-TR", {day:"numeric", month:"long"});
const fmtDY = d => d.toLocaleDateString("tr-TR", {day:"numeric", month:"short", year:"numeric"});
function rel(d, T) { const n = dayDiff(T, d); if (n === 0) return "bugün"; if (n === 1) return "yarın"; if (n === -1) return "dün"; return n > 0 ? n + " gün sonra" : (-n) + " gün önce"; }
const signed = t => DEBIT.has(t.kind) ? t.amount : POINTS.has(t.kind) ? 0 : -t.amount;
const nfP = new Intl.NumberFormat("tr-TR", {maximumFractionDigits:2});
const amtLabel = t => POINTS.has(t.kind) ? nfP.format(t.amount) + " puan" : nfC.format(t.amount);
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0);
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const bankDot = b => `<span class="dot" style="background:hsl(${hue(b)} 48% 46%)"></span>`;
const accName = a => a ? (a.bank + (a.name ? " " + a.name : "") + (a.last4 ? " ••" + a.last4 : "")) : "Silinmiş hesap";
const accById = id => S.accounts.find(a => a.id === id);
function norm(s) {
  return String(s).toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/â/g,"a").replace(/î/g,"i");
}

// ---------- rates (config/rates, her ayın 1'i ve 15'i güncellenir) ----------
function bankKey(name) { const n = norm(name); const row = BANKS.find(b => norm(b[0]) === n || b[1].some(al => aliasHit(n, al))); return row ? row[0] : name; }
const fmtIso = s => s ? fmtD(parseISO(s)) : "";
function cardRate(a, stmt) {
  const R = S.rates;
  if (a.autoRate === false || !R) return {rate:+a.rate || 0, src:"Elle girilen oran"};
  const b = (R.banks || {})[bankKey(a.bank)];
  const own = b && b.kartTiers && b.kartTiers.length;
  const tiers = own ? b.kartTiers : (R.tcmb && R.tcmb.kartTiers) || [];
  const tier = tiers.find(t => t.upTo == null || stmt < t.upTo) || tiers[tiers.length - 1];
  if (!tier) return {rate:+a.rate || 0, src:"Elle girilen oran"};
  return {rate:+tier.rate, src:(own ? bankKey(a.bank) + " ücret tablosu" : "TCMB azami oranı") + " · " + fmtIso((own && b.checked) || R.updated)};
}
function kmhRate(a) {
  const R = S.rates;
  if (a.autoRate === false || !R) return {rate:+a.rate || 0, src:"Elle girilen oran"};
  const b = (R.banks || {})[bankKey(a.bank)];
  if (b && b.kmh > 0) return {rate:+b.kmh, src:bankKey(a.bank) + " ücret tablosu · " + fmtIso(b.checked || R.updated)};
  if (R.tcmb && R.tcmb.kmh > 0) return {rate:+R.tcmb.kmh, src:"TCMB azami oranı · " + fmtIso(R.updated)};
  return {rate:+a.rate || 0, src:"Elle girilen oran"};
}

// ---------- calculations ----------
function cardCalc(a, T) {
  const txs = S.tx.filter(t => t.accountId === a.id);
  const opening = +a.opening || 0, limit = +a.limit || 0;
  let debt = opening; for (const t of txs) debt += signed(t);
  const sd = +a.statementDay || 1, dd = +a.dueDay || 10;
  const lastSt = lastStatement(sd, T);
  const nextSt = dateInMonth(lastSt.getFullYear(), lastSt.getMonth() + 1, sd);
  const dueOf = st => dd > sd ? dateInMonth(st.getFullYear(), st.getMonth(), dd) : dateInMonth(st.getFullYear(), st.getMonth() + 1, dd);
  const dueLast = dueOf(lastSt);
  const target = T <= dueLast ? lastSt : nextSt;
  const due = dueOf(target);
  const points = (+a.pointsOpening || 0) + txs.reduce((s, t) => s + (t.kind === "puan_ekle" ? t.amount : t.kind === "puan_kullan" ? -t.amount : 0), 0);
  const creditsUpTo = d => txs.filter(t => !DEBIT.has(t.kind) && !POINTS.has(t.kind) && parseISO(t.date) <= d).reduce((s, t) => s + t.amount, 0);
  const billedAt = st => {
    let s = opening;
    for (const t of txs) {
      if (!DEBIT.has(t.kind)) continue;
      const td = parseISO(t.date), n = Math.max(1, +t.installments || 1);
      if (n === 1) { if (td <= st) s += t.amount; }
      else s += t.amount * Math.min(n, stmtCount(sd, td, st)) / n;
    }
    return s;
  };
  const billed = billedAt(target);
  const allDebits = opening + txs.filter(t => DEBIT.has(t.kind)).reduce((s, t) => s + t.amount, 0);
  const unbilled = Math.max(0, allDebits - billed);
  const stmt = Math.max(0, billed - creditsUpTo(T));
  const rateInfo = cardRate(a, stmt), rate = rateInfo.rate;
  const minRatio = +a.minPct > 0 ? +a.minPct / 100 : limit < 50000 ? 0.2 : 0.4;
  const min = stmt * minRatio;
  const interestIfMin = Math.max(0, stmt - min) * rate / 100 * TAX;
  let overdueAmt = 0;
  // gecikme = son ekstrenin ASGARİSİ son ödeme gününe kadar ödenmediyse; asgari ödenip kalan devrettiyse gecikme değil, faizli devir
  if (T > dueLast && (a.openingDate || "0000") <= iso(lastSt) && !(a.overdueAck && iso(dueLast) <= a.overdueAck)) {
    const stmtLast = Math.max(0, billedAt(lastSt) - creditsUpTo(lastSt));
    const paidWin = txs.filter(t => !DEBIT.has(t.kind) && !POINTS.has(t.kind) && parseISO(t.date) > lastSt && parseISO(t.date) <= dueLast).reduce((s, t) => s + t.amount, 0);
    overdueAmt = Math.max(0, stmtLast * minRatio - paidWin);
    if (overdueAmt < 1) overdueAmt = 0;
  }
  const dl = dayDiff(T, due);
  const status = stmt < 0.5 ? "odendi" : dl <= 5 ? "yakin" : "normal";
  const upcoming = [{date:due, amount:stmt, sub:`Ekstre (${fmtD(target)}) · asgari ${money(min)}`, status, min}];
  if (overdueAmt) upcoming.unshift({date:dueLast, amount:overdueAmt, sub:"Geçen ekstrenin asgarisi tam ödenmedi (eksik kalan)", status:"gecikti"});
  return {debt, avail:limit - debt, util:limit ? Math.max(0, debt) / limit : 0, stmt, min, minRatio, due, target, unbilled,
    interestIfMin, overdueAmt, monthInt:0, riskInt:interestIfMin, upcoming, lastSt, nextSt, rate, rateSrc:rateInfo.src, points};
}

function kmhCalc(a, T) {
  const txs = S.tx.filter(t => t.accountId === a.id).sort(byDate);
  const opening = +a.opening || 0, limit = +a.limit || 0, rateInfo = kmhRate(a), rate = rateInfo.rate;
  let used = opening; for (const t of txs) used += signed(t);
  const daily = rate / 100 / 30 * TAX;
  const start = parseISO(a.lastPost || a.openingDate || iso(T));
  let bal = opening, i = 0, accrued = 0;
  const d = new Date(start);
  while (i < txs.length && parseISO(txs[i].date) < d) { bal += signed(txs[i]); i++; }
  let guard = 0;
  while (d < T && guard++ < 3700) {
    while (i < txs.length && parseISO(txs[i].date) <= d) { bal += signed(txs[i]); i++; }
    accrued += Math.max(0, bal) * daily;
    d.setDate(d.getDate() + 1);
  }
  const monthEnd = new Date(T.getFullYear(), T.getMonth() + 1, 0);
  const left = dayDiff(T, monthEnd) + 1;
  const projected = accrued + Math.max(0, used) * daily * left;
  const monthly = Math.max(0, used) * rate / 100 * TAX;
  const upcoming = used > 0.5 ? [{date:monthEnd, amount:projected, sub:"Tahmini faiz tahakkuku (KKDF+BSMV dahil)", status:"normal"}] : [];
  return {debt:Math.max(0, used), used, avail:limit - Math.max(0, used), util:limit ? Math.max(0, used) / limit : 0,
    accrued, projected, monthly, monthInt:monthly, riskInt:0, upcoming, since:start, rate, rateSrc:rateInfo.src};
}

// kredi: aylık ya da p ayda bir (a.period) eşit taksit; banka ödeme tablosu girildiyse (a.plan) birebir o tablo kullanılır
function loanCalc(a, T) {
  const P = +a.principal || 0, p = Math.max(1, Math.round(+a.period || 1)), plan = Array.isArray(a.plan) && a.plan.length ? a.plan : null;
  const n = plan ? plan.length : Math.max(1, +a.term || 1);
  const i = (+a.rate || 0) / 100 * (a.taxFree ? 1 : TAX) * p; // dönem faizi
  const pays = S.tx.filter(t => t.accountId === a.id && t.kind === "odeme").length;
  const k = Math.min(n, (+a.paidBefore || 0) + pays);
  const schedule = [];
  if (plan) {
    let bal = P || plan.reduce((s, x) => s + (+x.prin || 0), 0);
    plan.forEach((x, j) => { const prin = +x.prin || 0, pay = +x.total || prin + (+x.int || 0); bal = Math.max(0, bal - prin);
      schedule.push({no:j + 1, date:parseISO(x.date), pay, int:pay - prin, prin, bal, paid:j < k}); });
  } else {
    const A0 = +a.installment > 0 ? +a.installment : (i > 0 ? P * i / (1 - Math.pow(1 + i, -n)) : P / n);
    const balAt = j => Math.max(0, i > 0 ? P * Math.pow(1 + i, j) - A0 * (Math.pow(1 + i, j) - 1) / i : P - A0 * j);
    const first = parseISO(a.firstDue || iso(T));
    for (let j = 1; j <= n; j++) { const int = balAt(j - 1) * i; schedule.push({no:j, date:addMonths(first, (j - 1) * p), pay:A0, int, prin:A0 - int, bal:balAt(j), paid:j <= k}); }
  }
  const next = schedule[k] || null, A = next ? next.pay : (schedule[n - 1] || {pay:0}).pay;
  const B = k >= n ? 0 : (k ? schedule[k - 1].bal : (P || schedule.reduce((s, x) => s + x.prin, 0)));
  const nextDue = next ? next.date : null;
  let overdueCount = 0;
  while (schedule[k + overdueCount] && schedule[k + overdueCount].date < T) overdueCount++;
  const nextInterest = next ? next.int : 0;
  const rest = schedule.slice(k), remainingPay = rest.reduce((s, x) => s + x.pay, 0);
  const status = !nextDue ? "odendi" : overdueCount ? "gecikti" : dayDiff(T, nextDue) <= 5 ? "yakin" : "normal";
  const dueAmt = overdueCount ? schedule.slice(k, k + overdueCount).reduce((s, x) => s + x.pay, 0) : A;
  const upcoming = nextDue ? [{date:nextDue, amount:dueAmt, sub:`${k + 1}/${n}. taksit${overdueCount > 1 ? " · " + overdueCount + " taksit gecikmede" : ""}${p > 1 ? " · " + p + " ayda bir" : ""}`, status}] : [];
  return {debt:B, A, k, n, i, p, nextDue, overdueCount, nextInterest, remainingPay, remainingInterest:rest.reduce((s, x) => s + x.int, 0),
    schedule, monthInt:k < n ? nextInterest / p : 0, riskInt:0, upcoming, avail:0};
}
// banka ödeme tablosu metni → plan: her satırda bir tarih ve tutarlar (anapara … taksit). Tek tutar varsa taksit sayılır.
function parsePlan(text, principal) {
  const rows = [];
  for (const line of String(text || "").split(/\n+/)) {
    const dm = line.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{4})|(\d{4})-(\d{2})-(\d{2})/); if (!dm) continue;
    const date = dm[4] ? `${dm[4]}-${dm[5]}-${dm[6]}` : `${dm[3]}-${pad(+dm[2])}-${pad(+dm[1])}`;
    const nums = line.replace(dm[0], " ").match(/\d{1,3}(?:\.\d{3})*(?:,\d{1,2})|\d+(?:,\d{1,2})?/g) || [];
    const vals = nums.map(parseTRNumber).filter(v => v > 0 && !(v < 100 && Number.isInteger(v))); // sıra no gibi küçük tam sayıları at
    if (!vals.length) continue;
    rows.push({date, total:r2(vals[vals.length - 1]), prin:vals.length > 1 ? r2(vals[0]) : null});
  }
  rows.sort((a, b) => a.date.localeCompare(b.date));
  const each = principal > 0 ? principal / (rows.length || 1) : 0;
  return rows.map(x => ({date:x.date, prin:r2(x.prin != null ? x.prin : each), int:r2(x.total - (x.prin != null ? x.prin : each)), total:x.total}));
}
const planText = plan => (plan || []).map(x => `${fmtDY(parseISO(x.date))}  ${money(x.prin).replace(/\s?₺/, "")}  ${money(x.total).replace(/\s?₺/, "")}`).join("\n");

// ---------- sabit gelir / gider ----------
const ym = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const ymParse = s => { const [y, m] = String(s || "").split("-").map(Number); return y ? {y, m:(m || 1) - 1} : {y:today().getFullYear(), m:today().getMonth()}; };
const ymLabel = s => { const p = ymParse(s); return new Date(p.y, p.m, 1).toLocaleDateString("tr-TR", {month:"long", year:"numeric"}); };
function recOcc(r, from, to) {
  const out = [], st = ymParse(r.startMonth), n = +r.months > 0 ? +r.months : null;
  for (let i = 0; i < 600; i++) {
    if (n && i >= n) break;
    const d = dateInMonth(st.y, st.m + i, +r.day || 1);
    if (d > to) break;
    if (d >= from && !(r.skips && r.skips[ym(d)])) out.push({r, date:d, period:ym(d), no:i + 1, n, done:!!(r.done && r.done[ym(d)])});
  }
  return out;
}
function recInfo(r, T) {
  const st = ymParse(r.startMonth), n = +r.months > 0 ? +r.months : null;
  const elapsed = Math.max(0, (T.getFullYear() - st.y) * 12 + (T.getMonth() - st.m) + 1);
  const end = n ? dateInMonth(st.y, st.m + n - 1, +r.day || 1) : null;
  return {n, cur:n ? Math.min(n, elapsed) : elapsed, left:n ? Math.max(0, n - elapsed) : null, end, finished:!!(end && end < addDays(T, -31))};
}
const recSign = r => r.kind === "gelir" ? "+" : "−";
function recRows(T) { // son 60 gün (bekleyen) + önümüzdeki 62 gün
  const rows = [];
  for (const r of S.recurring) for (const o of recOcc(r, addDays(T, -60), addDays(T, 62))) {
    if (o.date < T && o.done) continue;
    const st = o.done ? "odendi" : o.date < T ? (r.kind === "gelir" ? "bekleniyor" : "gecikti") : dayDiff(T, o.date) <= 3 ? "yakin" : "normal";
    rows.push({date:o.date, amount:occAmount(r, o.period), rec:true, r, period:o.period, gelir:r.kind === "gelir", acc:accById(r.accountId) || null,
      sub:(recNote(r, o.period) || (r.kind === "gelir" ? "Sabit gelir" : "Sabit gider")) + (o.n ? ` · ${o.no}/${o.n}. ay` : "") + (accById(r.accountId) ? " · " + accName(accById(r.accountId)) : ""), status:st});
  }
  return rows;
}
// gelir hesaba girince / gider hesaptan çıkınca hangi hareket türü olduğu
function settleKind(kind, acc) {
  if (kind === "gelir") return acc.type === "kmh" ? "yatirma" : acc.type === "nakit" ? "gelir" : "odeme";
  return acc.type === "kmh" ? "cekim" : acc.type === "kart" ? "harcama" : acc.type === "nakit" ? "gider" : "odeme";
}
// hesaplar arası aktarım: kaynaktan çıkış + hedefe giriş, iki hareket tek transferId ile bağlı
function transfer(fromId, toId, amount, date, desc) {
  const from = accById(fromId), to = accById(toId);
  if (!from || !to || from.id === to.id || !(amount > 0)) return null;
  const tid = uid(), d = date || iso(today()), am = r2(amount);
  const outKind = from.type === "kmh" ? "cekim" : from.type === "kart" ? "nakit" : from.type === "nakit" ? "gider" : null;
  const inKind = to.type === "kmh" ? "yatirma" : to.type === "nakit" ? "gelir" : "odeme";
  if (!outKind) return null;
  const label = desc || (accName(from) + " → " + accName(to));
  const t1 = {id:uid(), accountId:from.id, kind:outKind, amount:am, date:d, installments:1, desc:label, category:"", transferId:tid, created:Date.now()};
  const t2 = {id:uid(), accountId:to.id, kind:inKind, amount:am, date:d, installments:1, desc:label, category:"", transferId:tid, created:Date.now() + 1};
  putTx(t1); putTx(t2);
  return {op:"transfer", t1, t2};
}
function settle(r, period, amount, accountId, date) {
  if (r.hotelLedger) { // otel carisine bağlı kira: tahsilat otel carisine ve seçilen hesaba işlenir
    const p = addHotelPayment({type:"payment", amount, date, accountId, desc:r.name + " (" + ymLabel(period) + ")", recurringId:r.id, period});
    markDone(r.id, period, "hp:" + p.id); saveAccounts();
    return {op:"settle", rid:r.id, period, name:r.name, amount, kind:r.kind, p};
  }
  const acc = accById(accountId);
  if (!acc) { markDone(r.id, period, "nakit"); saveAccounts(); return {op:"settle", rid:r.id, period, name:r.name, amount, kind:r.kind}; }
  const t = {id:uid(), accountId:acc.id, kind:settleKind(r.kind, acc), amount:r2(amount), date:date || iso(today()), installments:1,
    desc:r.salary ? "Maaş (" + ymLabel(prevYm(period)) + ")" : r.name, category:r.kind === "gelir" ? "Gelir" : (r.category || ""), recurringId:r.id, period, created:Date.now()};
  putTx(t);
  return {op:"settle", rid:r.id, period, name:r.name, amount, kind:r.kind, tx:t};
}

// ---------- maaş (Mühendis Maaş Hesaplama kuralları) ----------
// Taban her ay sabit 225 saat (30 gün × 7,5 s). Ücretsiz izin ve geç/erken saat tabandan düşer;
// mesai %50 zamlı, Pazar çalışması %50 ilave yevmiye, resmi tatil çalışması %100 ilave yevmiye olarak eklenir.
// Kesintiler: SGK %14, işsizlik %1, kümülatif dilimli gelir vergisi (asgari ücret istisnalı), damga binde 7,59, isteğe bağlı BES %3.
const SAL_DAILY = 7.5, SAL_STD_H = 225;
const UBGT = {"2026-01-01":"Yılbaşı","2026-03-20":"Ramazan Bayramı","2026-03-21":"Ramazan Bayramı","2026-03-22":"Ramazan Bayramı","2026-04-23":"23 Nisan",
  "2026-05-01":"1 Mayıs","2026-05-19":"19 Mayıs","2026-05-27":"Kurban Bayramı","2026-05-28":"Kurban Bayramı","2026-05-29":"Kurban Bayramı","2026-05-30":"Kurban Bayramı",
  "2026-07-15":"15 Temmuz","2026-08-30":"30 Ağustos","2026-10-29":"29 Ekim","2027-01-01":"Yılbaşı","2027-04-23":"23 Nisan","2027-05-01":"1 Mayıs",
  "2027-05-19":"19 Mayıs","2027-07-15":"15 Temmuz","2027-08-30":"30 Ağustos","2027-10-29":"29 Ekim",
  "2027-03-09":"Ramazan Bayramı","2027-03-10":"Ramazan Bayramı","2027-03-11":"Ramazan Bayramı",
  "2027-05-16":"Kurban Bayramı","2027-05-17":"Kurban Bayramı","2027-05-18":"Kurban Bayramı","2027-05-19":"Kurban Bayramı / 19 Mayıs"};
// gelir vergisi dilimleri ve asgari ücret yıla göre; yeni yılın değerleri açıklanınca config/rates.taxYears'a yazılır (ayın 1'i/15'i görevi)
const TAX_2026 = {brackets:[[0, 190000, .15], [190000, 400000, .20], [400000, 1500000, .27], [1500000, 5300000, .35], [5300000, Infinity, .40]], minMatrah:28075.50, minGross:33030};
function taxYear(y) {
  const c = S.rates && S.rates.taxYears && (S.rates.taxYears[y] || S.rates.taxYears[String(y)]);
  if (c && Array.isArray(c.brackets) && c.brackets.length) return {brackets:c.brackets.map(b => [+b[0], b[1] == null ? Infinity : +b[1], +b[2]]), minMatrah:+c.minMatrah || TAX_2026.minMatrah, minGross:+c.minGross || TAX_2026.minGross, official:true};
  return {...TAX_2026, official:+y === 2026};
}
const isHol = ds => UBGT[ds] || (S.rates && S.rates.holidays && S.rates.holidays[ds]) || "";
let TAX_BR = TAX_2026.brackets, MIN_MATRAH = TAX_2026.minMatrah, MIN_GROSS = TAX_2026.minGross;
const cumTax = (m, br) => { let t = 0; for (const [lo, hi, r] of (br || TAX_BR)) { if (m <= lo) break; t += (Math.min(m, hi) - lo) * r; } return t; };
const salSet = () => S.salary && S.salary.settings;
const prevYm = per => { const p = ymParse(per); return ym(new Date(p.y, p.m - 1, 1)); };
const dayRec = ds => (S.salary.days || {})[ds] || {};
function netFromGross(g, st) {
  const ssg = g * st.ssg / 100, is = g * st.issz / 100, mat = g - ssg - is;
  const tax = Math.max(0, cumTax(mat) - cumTax(MIN_MATRAH));
  const dm = Math.max(0, g * st.damga / 1000 - MIN_GROSS * st.damga / 1000);
  return g - ssg - is - tax - dm - (st.bes ? g * .03 : 0);
}
let grossCache = {k:"", v:0};
function stdGross(st) { // girilen neti Ocak referansında veren brüt (ikiye bölme)
  const k = [st.net, st.ssg, st.issz, st.damga, st.bes, MIN_MATRAH, MIN_GROSS, JSON.stringify(TAX_BR)].join("|");
  if (grossCache.k === k) return grossCache.v;
  let lo = 0, hi = Math.max(st.net * 2, 10000), g = 0;
  while (netFromGross(hi, st) < st.net && g++ < 50) hi *= 2;
  for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (netFromGross(mid, st) < st.net) lo = mid; else hi = mid; }
  grossCache = {k, v:(lo + hi) / 2};
  return grossCache.v;
}
function salHours(period) {
  const p = ymParse(period), last = new Date(p.y, p.m + 1, 0).getDate();
  const h = {mesai:0, pazar:0, rt:0, eksik:0, unpaid:0, unpaidDays:0, paidDays:0};
  for (let d = 1; d <= last; d++) {
    const ds = p.y + "-" + pad(p.m + 1) + "-" + pad(d), x = dayRec(ds);
    const sun = new Date(p.y, p.m, d).getDay() === 0, hol = !!isHol(ds), ek = Math.min(SAL_DAILY, +x.eksik || 0);
    if (sun || hol) { h.eksik += ek; if (sun && x.pazar) h.pazar += SAL_DAILY; else if (!sun && hol && x.rt) h.rt += SAL_DAILY; }
    else if ((x.type || "work") === "unpaid") { h.unpaid += SAL_DAILY; h.unpaidDays++; }
    else { h.eksik += ek; if (x.type === "paid") h.paidDays++; }
    h.mesai += +x.mesai || 0;
  }
  h.normal = Math.max(0, SAL_STD_H - h.unpaid - h.eksik);
  return h;
}
function salaryCalc(period) {
  const st = salSet(); if (!st) return null;
  const ty = taxYear(ymParse(period).y); TAX_BR = ty.brackets; MIN_MATRAH = ty.minMatrah; MIN_GROSS = ty.minGross;
  const hourly = stdGross(st) / SAL_STD_H;
  const grossOf = per => { const h = salHours(per); return {h, gross:h.normal * hourly + h.mesai * hourly * 1.5 + h.pazar * hourly * 1.5 + h.rt * hourly}; };
  const p = ymParse(period), since = ymParse(st.since || p.y + "-01");
  let cumBefore = 0;
  for (let m = 0; m < p.m; m++) {
    if (p.y < since.y || (p.y === since.y && m < since.m)) continue;
    cumBefore += grossOf(p.y + "-" + pad(m + 1)).gross * (1 - (st.ssg + st.issz) / 100);
  }
  const {h, gross} = grossOf(period);
  const ssg = gross * st.ssg / 100, issz = gross * st.issz / 100, matrah = gross - ssg - issz, ai = p.m + 1;

// Ham bedel = tüketim × birim fiyat; ETV %5 (ham üzerinden); KDV %20 (ham + ETV üzerinden).
// Otelin öz tüketim faturası = genel toplam − ZES faturası (vergiler dahil).
// Tahsilatlar (iadeler düşülerek) en eski aydan başlanıp sırayla borçlara dağıtılır.
function elecCalc(e) {

}
function hotelCalc() {
  const H = S.hotel, months = {};

  for (const [per, e] of Object.entries(H.elec || {})) { const c = elecCalc(e), x = m(per); x.e = c; x.elec += c.tenant; x.total += c.tenant; }
  for (const ch of H.charges || []) { const x = m(ch.period); x.charges += +ch.amount || 0; x.items.push(ch); x.total += +ch.amount || 0; }
  const monthEnd = new Date(today().getFullYear(), today().getMonth() + 1, 0);
  for (const r of S.recurring || []) if (r.hotelLedger && r.kind === "gelir") for (const o of recOcc(r, new Date(2000, 0, 1), monthEnd)) {
    const x = m(o.period), amt = recAmount(r, o.period); x.charges += amt; x.items.push({kind:"Kira", desc:r.name, amount:amt}); x.total += amt;
  }
  for (const b of S.bills || []) if (b.recharge) { const x = m(b.period || b.due.slice(0, 7)); x.charges += +b.amount || 0; x.items.push({kind:"Fatura", desc:b.name, amount:b.amount}); x.total += +b.amount || 0; }
  let inc = 0, ref = 0;
  for (const p of H.payments || []) { if (p.type === "refund") ref += +p.amount; else inc += +p.amount; }
  const net = inc - ref, asc = Object.keys(months).sort();
  let pool = Math.max(0, net), debt = 0;
  for (const k of asc) { const x = months[k], pay = Math.min(pool, Math.max(0, x.total)); debt += x.total; x.paid = pay; x.remaining = x.total - pay; pool -= pay; }
  return {months:asc.map(k => months[k]), debt, inc, ref, net, balance:debt - net, advance:pool};
}

// kişiyle para hareketi: hesap seçildiyse hesaptan düşer/hesaba girer; seçilmediyse kişinin notlarına yazılır
function personTx(x) {
  const p = personById(x.personId); if (!p) return null;
  const pk = PKIND[x.pkind] ? x.pkind : "gonder", out = P_OUT.has(pk), acc = accById(x.accountId), amt = r2(+x.amount), date = x.date || iso(today());
  const desc = (out ? p.name + "'e " : p.name + "'den ") + PKIND[pk].toLowerCase() + (x.desc ? " · " + x.desc : "");
  if (acc) {

    const t = {id:uid(), accountId:acc.id, kind, amount:amt, date, installments:1, desc:desc.slice(0, 80), category:"", personId:p.id, pkind:pk, created:Date.now()};
    putTx(t); return {op:"ptx", t, p};
  }
  const e = {id:uid(), pkind:pk, amount:amt, date, desc:String(x.desc || "").slice(0, 80)};
  S.people = S.people.map(y => y.id === p.id ? {...y, log:(y.log || []).concat([e])} : y); saveAccounts();

}
function personCalc(p) {
  const rows = S.tx.filter(t => t.personId === p.id).map(t => ({id:t.id, pkind:t.pkind || (["gelir", "yatirma", "odeme"].includes(t.kind) ? "al" : "gonder"), amount:t.amount, date:t.date, desc:t.desc, acc:accById(t.accountId), tx:true}))
    .concat((personById(p.id).log || []).map(e => ({...e, acc:null, tx:false}))).sort((a, b) => b.date.localeCompare(a.date));
  const sum = k => rows.filter(r => r.pkind === k).reduce((s, r) => s + r.amount, 0);
  const bills = (S.bills || []).filter(b => b.personId === p.id && !b.paid);
  return {rows, sent:sum("gonder"), got:sum("al"), receivable:sum("borc_ver") - sum("tahsil"), payable:sum("borc_al") - sum("ode"), bills,
    openRecv:bills.filter(b => b.dir === "alacak").reduce((s, b) => s + +b.amount, 0), openPay:bills.filter(b => b.dir !== "alacak").reduce((s, b) => s + +b.amount, 0)};
}

// ---------- günlük hatırlatma özeti (zamanlanmış görev okur) ----------
let digestTimer = null;
function digestBody() {
  const C = computeAll();
  return {items:C.upcoming.filter(u => u.date >= addDays(C.T, -45)).map(u => ({date:iso(u.date), type:u.bill ? (u.b.hotel ? "otel_fatura" : "fatura") : u.rec ? u.r.kind : u.acc.type,
    title:upTitle(u), amount:r2(u.amount), done:u.status === "odendi", note:u.sub}))};
}
function scheduleDigest() {
  if (!digestRef) return;
  clearTimeout(digestTimer);
  digestTimer = setTimeout(() => { const b = digestBody(); digestRef.set({...b, generated:new Date().toISOString()}).catch(() => {}); }, 2000);
}
async function syncDigestOnLoad() {
  if (!digestRef) return;
  try { const s = await digestRef.get(); const old = s.exists ? JSON.stringify(s.data().items || []) : ""; if (old !== JSON.stringify(digestBody().items)) scheduleDigest(); } catch (e) {}
}

function nakitCalc(a) {
  const cash = (+a.opening || 0) + S.tx.filter(t => t.accountId === a.id).reduce((s, t) => s + (t.kind === "gelir" ? t.amount : t.kind === "gider" ? -t.amount : 0), 0);
  return {debt:0, avail:0, util:0, monthInt:0, riskInt:0, upcoming:[], cash};
}
function computeAll() {
  const T = today(), by = {};
  for (const a of S.accounts) by[a.id] = a.type === "kart" ? cardCalc(a, T) : a.type === "kmh" ? kmhCalc(a, T) : a.type === "nakit" ? nakitCalc(a) : loanCalc(a, T);
  let debt = 0, limit = 0, avail = 0, monthInt = 0, riskInt = 0, cardDebt = 0, cardLimit = 0, cash = 0;
  const upcoming = [], banks = {};
  for (const a of S.accounts) {
    const c = by[a.id], d = Math.max(0, c.debt);
    if (a.type === "nakit") { cash += c.cash; continue; }
    debt += d;
    if (a.type === "kart" || a.type === "kmh") { limit += +a.limit || 0; avail += Math.max(0, c.avail); }
    if (a.type === "kart") { cardDebt += d; cardLimit += +a.limit || 0; }
    monthInt += c.monthInt; riskInt += c.riskInt;
    for (const u of c.upcoming) upcoming.push({...u, acc:a});
    const b = banks[a.bank] || (banks[a.bank] = {bank:a.bank, debt:0, n:0, monthInt:0});
    b.debt += d; b.n++; b.monthInt += c.monthInt;
  }
  upcoming.push(...recRows(T), ...billRows(T));
  upcoming.sort((x, y) => x.date - y.date);
  const horizon = addDays(T, 30);
  const in30 = upcoming.filter(u => u.date <= horizon && u.status !== "odendi" && !u.gelir);
  const inc30 = upcoming.filter(u => u.date <= horizon && u.status !== "odendi" && u.gelir);
  return {T, by, debt, limit, avail, monthInt, riskInt, cardDebt, cardLimit, cash, upcoming, in30, inc30, incSum30:inc30.reduce((s, u) => s + u.amount, 0),
    due30:in30.reduce((s, u) => s + u.amount, 0), banks:Object.values(banks).sort((a, b) => b.debt - a.debt)};
}

// sabit kalemin o ayki taksiti/geliri bir harekete bağlıysa "tamamlandı" işareti hareketle birlikte gelir ve gider
function markDone(rid, period, val) {
  S.recurring = S.recurring.map(r => {
    if (r.id !== rid) return r;
    const done = {...(r.done || {})};
    if (val) done[period] = val; else delete done[period];
    return {...r, done};
  });
}
function putTx(t) {
  S.tx = S.tx.filter(x => x.id !== t.id).concat([t]);
  if (t.recurringId && t.period) { markDone(t.recurringId, t.period, t.id); saveAccounts(); }
  if (t.billId) { S.bills = (S.bills || []).map(b => b.id === t.billId && !b.paid ? {...b, paid:t.id, paidAccount:t.accountId} : b); saveAccounts(); }
  if (t.hotelPay && !(S.hotel.payments || []).some(p => p.id === t.hotelPay.id)) { S.hotel = {...S.hotel, payments:(S.hotel.payments || []).concat([{...t.hotelPay, txId:t.id}])}; saveAccounts(); }
  lsSave(); render(); scheduleDigest();
  if (txCol) txCol.doc(t.id).set({...t}).catch(e => toast(storeErr(e)));
}
function removeTx(id) {
  const t = S.tx.find(x => x.id === id);
  S.tx = S.tx.filter(t => t.id !== id);
  if (t && t.recurringId && t.period) { const r = S.recurring.find(r => r.id === t.recurringId); if (r && r.done && r.done[t.period] === id) { markDone(t.recurringId, t.period, null); saveAccounts(); } }
  if (t && t.billId) { S.bills = (S.bills || []).map(b => b.id === t.billId && b.paid === id ? {...b, paid:null, paidAccount:null} : b); saveAccounts(); }
  if (t && t.hotelPay) {
    S.hotel = {...S.hotel, payments:(S.hotel.payments || []).filter(p => p.txId !== id && p.id !== t.hotelPay.id)};
    if (t.hotelPay.recurringId) markDone(t.hotelPay.recurringId, t.hotelPay.period, null);
    saveAccounts();
  }
  lsSave(); render(); scheduleDigest();
  if (txCol) txCol.doc(id).delete().catch(e => toast(storeErr(e)));
  if (t && t.transferId) for (const p of S.tx.filter(x => x.transferId === t.transferId)) removeTx(p.id); // aktarımın karşı bacağı
}

// yıllık takvim: 12 ay, her ayda ödenecek borçlar ve beklenen gelir (kısaltılmış); aya dokununca aylık takvime geçer

// takvimdeki bir ay için: kart son ödemeleri, kredi taksitleri (tüm plan), KMH ay sonu, sabit kalemler ve faturalar

// ---------- yıllık gelir-gider (ay ay: gerçekleşen + beklenen) ----------
// gerçekleşen: o ayın hareketleri (gelen para; kart/kasa harcaması + KMH'den çıkan + faiz). aktarımlar sayılmaz.
// beklenen: henüz gelmemiş/ödenmemiş sabit kalemler, faturalar/alacaklar, kredi taksitleri ve KMH faizi tahmini.
function yearMonth(per, C) {
  const T = C.T, cur = ym(T), p = ymParse(per), from = new Date(p.y, p.m, 1), to = new Date(p.y, p.m + 1, 0);
  const r = per <= cur ? monthReport(per) : {inc:0, spend:0, kmhOut:0, fees:0};
  const items = [];
  for (const rr of S.recurring) for (const o of recOcc(rr, from, to)) if (!o.done) items.push({name:rr.name, amount:occAmount(rr, o.period), gelir:rr.kind === "gelir", date:o.date});
  for (const b of S.bills || []) { const d = parseISO(b.due); if (!b.paid && d >= from && d <= to) items.push({name:b.name, amount:+b.amount, gelir:b.dir === "alacak", date:d}); }
  for (const a of S.accounts) {
    const c = C.by[a.id];
    if (a.type === "kredi") for (const x of c.schedule) if (!x.paid && x.date >= from && x.date <= to) items.push({name:accName(a) + " · " + x.no + "/" + c.n + ". taksit", amount:x.pay, gelir:false, date:x.date});
    if (a.type === "kmh" && per >= cur) {
      const posted = per === cur && S.tx.some(t => t.accountId === a.id && t.kind === "faiz" && t.date.slice(0, 7) === per);
      const amt = per === cur ? (posted ? 0 : c.projected) : c.monthly;
      if (amt > 0.5) items.push({name:accName(a) + " faizi (tahmini)", amount:amt, gelir:false, date:to});
    }
  }
  items.sort((a, b) => a.date - b.date);
  const sum = g => items.filter(x => x.gelir === g).reduce((s, x) => s + x.amount, 0);
  return {per, incAct:r.inc, expAct:r.spend + r.kmhOut + r.fees, incPlan:sum(true), expPlan:sum(false), r, items};
}
function yearData(y, C) {

  const tot = k => months.reduce((s, x) => s + x[k], 0);
  return {y, months, incAct:tot("incAct"), incPlan:tot("incPlan"), expAct:tot("expAct"), expPlan:tot("expPlan")};
}

function personLine(c) {
  const parts = [];
  if (c.receivable > 0.5) parts.push("size borcu " + money0(c.receivable));
  if (c.payable > 0.5) parts.push("sizin borcunuz " + money0(c.payable));
  if (c.openRecv > 0.5 && c.receivable < 0.5) parts.push("alacak hatırlatması " + money0(c.openRecv));
  if (c.openPay > 0.5 && c.payable < 0.5) parts.push("borç hatırlatması " + money0(c.openPay));
  if (!parts.length) parts.push("gönderilen " + money0(c.sent) + " · alınan " + money0(c.got));
  return parts.join(" · ");
}

function undoApplied(list) {
  for (const x of (list || []).slice().reverse()) {
    if (x.op === "add") removeTx(x.tx.id);
    else if (x.op === "delete") (x.legs || [x.tx]).forEach(putTx);
    else if (x.op === "settle") unsettle(x);
    else if (x.op === "rec_add") { S.recurring = S.recurring.filter(r => r.id !== x.r.id); saveAccounts(); }
    else if (x.op === "rec_del") { S.recurring = S.recurring.concat([x.r]); saveAccounts(); }
    else if (x.op === "att") setDay(x.date, x.prev);
    else if (x.op === "elec") restoreElec(x.period, x.prev);
    else if (x.op === "transfer") removeTx(x.t1.id);
    else if (x.op === "accadd") { S.accounts = S.accounts.filter(a => a.id !== x.a.id); saveAccounts(); }
    else if (x.op === "person_add") { S.people = (S.people || []).filter(p => p.id !== x.p.id); saveAccounts(); }
    else if (x.op === "ptx") removeTx(x.t.id);
    else if (x.op === "plog") { S.people = (S.people || []).map(p => p.id === x.p.id ? {...p, log:(p.log || []).filter(e => e.id !== x.e.id)} : p); saveAccounts(); }
    else if (x.op === "bclose") { const ids = new Set(x.bills.map(b => b.id)); S.bills = S.bills.map(b => ids.has(b.id) ? {...b, paid:null} : b); saveAccounts(); }
    else if (x.op === "unit_add") { S.units = (S.units || []).filter(u => u.id !== x.u.id); saveAccounts(); }
    else if (x.op === "mem") { S.memory = (S.memory || []).filter(m => m.id !== x.m.id); saveAccounts(); }
    else if (x.op === "memdel") { S.memory = (S.memory || []).concat([x.m]); saveAccounts(); }
    else if (x.op === "cat") { S.extraCats = (S.extraCats || []).filter(c => c !== x.c); const i = CATS.indexOf(x.c); if (i >= 0) CATS.splice(i, 1); saveAccounts(); }
    else if (x.op === "txedit") { putTx(x.prev); if (x.prev.transferId) for (const p of S.tx.filter(y => y.transferId === x.prev.transferId && y.id !== x.prev.id)) putTx({...p, amount:x.prev.amount, date:x.prev.date}); }
    else if (x.op === "restore") { S[x.coll] = S[x.coll].map(y => y.id === x.prev.id ? x.prev : y); saveAccounts(); }
    else if (x.op === "accdel") { S.accounts = S.accounts.concat([x.a]); saveAccounts(); bulkPutTx(x.txs); }
    else if (x.op === "hrestore") { S.hotel = x.hotel; S.recurring = x.rec; saveAccounts(); if (x.txs.length) bulkPutTx(x.txs); }
    else if (x.op === "badd") { S.bills = (S.bills || []).filter(b => b.id !== x.b.id); saveAccounts(); }
    else if (x.op === "bpay") unpayBill(x.id);
    else if (x.op === "bdel") { S.bills = (S.bills || []).concat([{...x.b, paid:null, paidAccount:null}]); saveAccounts(); }
    else if (x.op === "hpay") removeHotelPayment(x.p.id);
    else if (x.op === "hcharge") { S.hotel = {...S.hotel, charges:(S.hotel.charges || []).filter(c => c.id !== x.c.id)}; saveAccounts(); }

  }
}

İŞLEM TÜRLERİ (kind), hesap türüne göre:

- kmh: "cekim" (hesaptan para çekme ya da hesaptan yapılan harcama/ödeme), "yatirma" (hesaba para yatırma), "faiz"
- kredi: "odeme" (taksit ödemesi; tutar söylenmezse hesabın taksit_tutari)

KURALLAR:
- Hesabı banka adına, kart adına (Bonus, Axess, World, Maximum, Paraf…), son 4 haneye veya türe (kart / ek hesap / kredi) göre eşleştir. Tek hesaba net eşleşmiyorsa o işlemi ekleme; reply içinde hangi hesap olduğunu sor.
- YÖN ÇOK ÖNEMLİ. Kartta: "Garanti business karttan 2000 ödeme yaptım", "kartla ödedim", "kartımdan çekti", "kartla market" = kartla yapılan HARCAMA (kind "harcama"; borç artar, limit düşer). "Kartıma / kart borcuma / ekstreye 5 bin ödeme yaptım", "kartımı ödedim", "asgariyi ödedim" = karta BORÇ ÖDEMESİ (kind "odeme"). Ayrılma eki (-dan/-den/-la/-le/ile) harcama, yönelme eki (-a/-e/-ma/-me) ya da "borç/ekstre/asgari" ödeme demektir.
- KMH'de: "KMH'den 1.500 kullandım / ödedim / çektim / harcadım" = "cekim" (kullanılan artar). "KMH'ye 3 bin ekledim / yatırdım", "ek hesabı kapattım" = "yatirma" (kullanılan azalır).
- PUAN: Bonus, WorldPuan, Maxipuan, ParafPara, chip-para, Bankkart Lira gibi kart puanları borcu değiştirmez. "Bonus kartıma 250 puan geldi / kazandım" = "puan_ekle". "Garanti'den 150 puan kullandım" = "puan_kullan". Bir alışverişin bir kısmı puanla ödendiyse iki kayıt yap: karttan çekilen kısım için "harcama" (toplam eksi puan), kullanılan puan için "puan_kullan". Örn. "Migros'ta 500 TL'lik alışverişte 200 bonus kullandım" = harcama 300 + puan_kullan 200. Puan bakiyesinden fazla kullanım söylenirse yine kaydet ama reply'da belirt.
- SABİT GELİR/GİDER TANIMLAMA: "Kira gelirim her ayın 5'inde 15.000 TL, 12 ay boyunca İş Bankası KMH'ye yatacak" → {"op":"add_recurring","kind":"gelir","name":"Kira geliri","amount":15000,"day":5,"startMonth":"YYYY-MM","months":12,"accountId":"<KMH id ya da null>","category":""}. Süre söylenmezse months null (süresiz). Başlangıç söylenmezse bu ay (gün geçtiyse yine bu ay). Gider için kind "gider" ve uygun category.
- SABİT KALEMİN GELMESİ/ÖDENMESİ: Mesaj SABİT GELİR/GİDERLER listesindeki bir kaleme karşılık geliyorsa ("kira geldi, İş Bankası KMH'ye yatırdım", "GES'ten 8.400 geldi KMH'ye yatır", "aidatı Garanti kartla ödedim") {"op":"settle_recurring","recurringId":"...","period":"YYYY-MM","amount":<söylenen ya da kalemin tutarı>,"accountId":"<söylenen hesap, yoksa varsayılan; nakitse null>","date":"YYYY-MM-DD"} kullan. period genelde bu ay; bu ay zaten tamamsa ve geçen ay değilse geçen ay. Gelir KMH'ye yatınca KMH borcu azalır, karta yatınca kart borcu ödenir; gider karttan harcama, KMH'den çekim olur — bunu uygulama yapar, ayrıca "add" ekleme.
- Listede olmayan tek seferlik gelir ("GES'ten 8 bin geldi KMH'ye yatırdım" ama GES kalemi yoksa): KMH'ye "yatirma" / karta "odeme" ekle, desc "GES geliri", category "Gelir".
- Tek seferlik ek giderler ("araba bakımı 4.500 Garanti kartla", "lastik değişimi KMH'den 6 bin"): ilgili hesaba "harcama" ya da "cekim", category "Araç" gibi uygun kategori.
- DEĞİŞKEN TUTARLI KALEMLER (degisken_tutar=true, ör. GES, elektrik): her ay farklı gelir. "GES'ten 6.250 geldi Ziraat KMH'ye aktardım" → settle_recurring amount 6250, accountId Ziraat KMH. Tutar söylenmemişse ekleme yapma, reply'da tutarı sor. Yeni tanımlarken "her ay farklı/değişken" denirse add_recurring'e "variable":true ekle (amount tahmini, bilinmiyorsa 1).
- SON ÖDEME TARİHLİ FATURALAR: "Otelin su faturası 500 TL geldi, son ödemesi 16'sı" → {"op":"add_bill","name":"Su faturası","amount":500,"due":"YYYY-MM-DD","period":"YYYY-MM","hotel":true,"recharge":true}. "Doğalgaz 1.250 TL son ödeme 20 Kasım", "araç sigortası 8.400 son ödeme 3 Aralık" → hotel false. due: söylenen gün bu ay geçmişse gelecek ayın o günü. hotel=true: otel kirada ve abonelik kullanıcının adına; kullanıcı öder, parayı kiracıdan alır. recharge: tutar otelin borcuna eklensin mi — su, doğalgaz, internet, aidat vb. için true; ELEKTRİK için false (otelin elektrik payı zaten ZES hesabından geliyor). Fatura ödenmiş olarak söylendiyse ("ödedim") add_bill'in ardından pay_bill de yaz ya da yalnızca hesap hareketi yeterliyse "add" kullan.
  Ödeme: "su faturasını Ziraat KMH'den ödedim" → {"op":"pay_bill","billId":"...","accountId":"<id ya da null>","date":"YYYY-MM-DD"} (FATURALAR listesindeki açık kayıtla eşleştir; ayrıca "add" yazma). Silme yalnız açık istekte: {"op":"delete_bill","billId":"..."}.
- OTEL ELEKTRİĞİ: Hesap motoru: ham = kWh × birim fiyat; ETV %5; KDV %20 (ham+ETV üzerinden); otelin payı = genel toplam − ZES faturası. Bunu uygulama hesaplar, sen yalnız verileri kaydet.
  "ZES faturası 18.400 TL geldi (Ekim)" → {"op":"zes_bill","period":"YYYY-MM","amount":18400}. "Otelin Ekim elektriği 12.450 kWh, birim fiyat 3,85" → {"op":"hotel_bill","period":"YYYY-MM","consumption":12450,"unitPrice":3.85} (ZES aynı mesajda varsa "zes" alanını da ekle). Dönem söylenmezse fatura bir önceki aya aittir (bugüne göre önceki ay). ZES faturasını kullanıcı bir karttan/hesaptan ödediğini de söylerse ayrıca o hesaba "harcama"/"cekim" ekle.
  "Otelden 50.000 TL geldi, Ziraat KMH'ye" / "otel kirayı Garanti hesabıma yatırdı" → {"op":"hotel_payment","type":"payment","amount":50000,"accountId":"<hesap id ya da null>","date":"YYYY-MM-DD","desc":"kısa"}. Bu tek kayıt hem hesaba ekler hem otelin borcundan düşer; ayrıca "add" yazma. Otele para iade/gönderme → "type":"refund".
  Otele kira/vergi borcu yazma: {"op":"hotel_charge","period":"YYYY-MM","kind":"Kira|Vergi|Diğer","amount":X,"desc":"..."}.
  Otelden gelen para, sabit kalemlerdeki bir "kira geliri" ile aynıysa yine hotel_payment kullan (sabit kalemi settle etme), çünkü otel carisi tek yerden izlenir.
- MAAŞ / PUANTAJ: Maaş, sabit kalemlerde "maas":true olan kalemdir; tutarı bir önceki ayın puantajından hesaplanır ve ödeme gününde gelir olarak görünür. "Maaş yattı / maaşım geldi" → o kalem için settle_recurring (amount söylenmezse null bırak, uygulama hesaplanan neti kullanır; söylenen tutar varsa onu kullan).
  Günlük puantaj için {"op":"attendance","date":"YYYY-MM-DD","type":"work|paid|unpaid","addMesai":saat,"setMesai":saat,"addEksik":saat,"pazar":true/false,"rt":true/false} — yalnız söylenen alanları yaz:
  "bugün işe gitmedim / çalışmadım / gelmedim" → type "unpaid" (ücretsiz, maaştan düşer). "yıllık izindeyim / ücretli izin" → type "paid". "bugün 3 saat ekstra mesai yaptım" → addMesai 3. "dünkü mesai 2 saat değil 4 saat" → setMesai 4. "1 saat geç geldim / erken çıktım" → addEksik 1. "Pazar çalıştım" → pazar true (tarih o Pazar). "29 Ekim'de çalıştım" → rt true. "aslında bugün gittim" → type "work".
  Net maaş değişirse {"op":"salary_settings","net":60000} (ayrıca "payDay","accountId","bes" olabilir).
  Puantajdan sonra reply'da bu ayın yeni tahmini netini söyleme; uygulama gösterir. Kısa onay yaz.
- Sabit kalemi silme yalnız açıkça istenirse: {"op":"delete_recurring","recurringId":"..."}.
- YENİ KREDİ: {"op":"add_loan","bank":"Halkbank","name":"Esnaf annem","principal":1050000,"annualRate":20,"period":6,"taxFree":true,"plan":[{"date":"2027-04-15","prin":131250,"total":243250},…]}. Banka ödeme tablosu verildiyse (ekran görüntüsü/yapıştırılan tablo) her satırı plan'a yaz: date, prin=anapara, total=o satırın taksit tutarı (faiz+komisyon+masraf dahil). Tablo yoksa term (taksit sayısı), firstDue, period (1 aylık, 3, 6 ayda bir, 12 yıllık) ve rate (aylık %) ya da annualRate (yıllık %) ver. Kooperatif/konut kredisinde BSMV yoksa taxFree true. Mevcut krediye ödeme aralığı ya da oran düzeltmesi için edit_account (period, annualRate).
- Kredilerin faiz oranı sabittir; kredi hesaplarında oranla ilgili bir şey değiştirme.
- Tutarı TL sayısına çevir: "2 bin" = 2000, "1.250,50" = 1250.5, "bin beş yüz" = 1500.
- Tarih söylenmezse bugün. "dün", "geçen cuma", "3 gün önce" gibi ifadeleri çöz. Biçim YYYY-MM-DD.
- category şunlardan biri: ${CATS.join(", ")}. Ödeme, yatırma ve faizde boş bırak.
- desc kısa olsun (ör. "Migros", "Elektrik faturası").
- DÜZELTME VE SİLME (kullanıcı "sil", "iptal et", "yanlış girdim", "düzelt", "aslında … olacaktı", "tutarı … yap", "tarihini değiştir" derse; "son işlem/az önceki" = SON HAREKETLER'deki en yeni kayıt):
  hareket sil: {"op":"delete","txId":"..."} · hareket düzelt: {"op":"edit_tx","txId":"...","amount":X,"date":"YYYY-MM-DD","desc":"...","accountId":"...","kind":"...","installments":N,"category":"..."} (yalnız değişen alanlar) — düzeltmede silip yeniden ekleme yapma, edit_tx kullan.
  hesap düzelt: {"op":"edit_account","accountId":"...","limit":X,"rate":X,"statementDay":N,"dueDay":N,"name":"...","last4":"....","opening":X,"minPct":X,...} · hesap sil (yalnız açıkça "hesabı/kartı sil" denirse): {"op":"delete_account","accountId":"..."}.
  fatura/borç/alacak düzelt: {"op":"edit_bill","billId":"...","amount":X,"due":"YYYY-MM-DD","name":"...","dir":"borc|alacak"} · sil: {"op":"delete_bill","billId":"..."}.
  otel kaydı sil: {"op":"delete_hotel_payment","paymentId":"..."} · {"op":"delete_hotel_charge","chargeId":"..."} · {"op":"delete_elec","period":"YYYY-MM"}. Otel elektrik dönemini düzeltmek için zes_bill / hotel_bill aynı dönemle tekrar gönderilir (üzerine yazar).
- TEKRARLAYAN (VADELİ) KALEMLER — her ay ayrı ayrı yönetilir:
  Tanımlama: "her ayın 5'inde dükkan kirası 25.000 TL gelecek, 1 yıl sürecek" → add_recurring kind "gelir", name "Dükkan kirası", day 5, months 12 (yıl × 12), startMonth: söylenmezse bu ay (gün geçtiyse uygulama gelecek aydan başlatır). Kiracı otel ise ya da "otel carisine yaz" denirse "hotelLedger":true.
  Zam/indirim BELİRLİ BİR AYDAN İTİBAREN: "6. ayda zam yaptım, 30 bin oldu" → {"op":"recurring_change","recurringId":"...","fromIndex":6,"amount":30000} (kalemin 6. ayından sonuna kadar); "Mart'tan itibaren 30 bin" → "fromPeriod":"YYYY-MM". Önceki aylar değişmez.
  Yalnız tek bir ayı değiştir: {"op":"recurring_override","recurringId":"...","period":"YYYY-MM","amount":X} · tek ayı atla/iptal ("bu ay kira gelmeyecek"): {"op":"recurring_override","recurringId":"...","period":"YYYY-MM","skip":true} · geri al: "skip":false ya da "amount":null.
  Kalemin kendisini düzelt (gün, süre, ad, hesap, başlangıç, temel tutar): {"op":"update_recurring","recurringId":"...","day":N,"months":N,"name":"...","accountId":"...","startMonth":"YYYY-MM","amount":X}. "Süreyi 6 ay uzat" → months = mevcut ay_sayisi + 6. Silme: delete_recurring.
- HESAPLAR ARASI AKTARIM: "Ziraat KMH'den Garanti kart borcunu 10 bin ödedim", "KMH'den kasaya 5 bin çektim" → {"op":"transfer","fromAccountId":"...","toAccountId":"...","amount":X,"date":"YYYY-MM-DD","desc":"..."} (tek kayıt iki tarafı da işler; ayrıca add yazma).
- ALACAKLAR: "Ahmet'ten 20 bin alacağım, vadesi 30 Kasım", "müşteri çeki 45.000 TL vade 15 Aralık" → add_bill "dir":"alacak" (kategori Cari / Çek/Senet). Tahsil edilince pay_bill (hesaba girer).
- NAKİT KASA: tür "nakit" olan hesap; kind "gelir" (kasaya giren) / "gider" (kasadan çıkan).
- KİŞİLERLE PARA HAREKETİ: bir kişiye para gönderme/verme ya da kişiden alma "add" ile DEĞİL person_tx ile yazılır: {"op":"person_tx","personName":"Büşra","pkind":"gonder|al|borc_ver|tahsil|borc_al|ode","accountId":"<hesap id ya da null>","amount":5000,"date":"YYYY-MM-DD","desc":"kısa not","due":"YYYY-MM-DD ya da yok"}. Kişi listede yoksa otomatik eklenir; ad, listedeki kişiyle eşleşiyorsa (Büşra'ya/Büşra'dan → Büşra) listedeki adı kullan. accountId: paranın çıktığı/girdiği hesap ("KMH'den gönderdim" → o KMH; "kasadan/elden/nakit" → kasa hesabı varsa o, yoksa null; hesap söylenmediyse ve tek uygun hesap yoksa null). pkind: düz gönderme/harçlık/hediye/ödeme → gonder; kişiden düz para geldi → al; "borç verdim" → borc_ver; o borcu geri ödedi/geri verdi → tahsil; "borç aldım" → borc_al; kişiye olan borcumu ödedim → ode. Geri ödeme günü söylendiyse ("30 Kasım'da verecek", "ay sonu öderim") due yaz: o gün sabah hatırlatılır (ayrıca add_bill yazma). Geri ödeme gelince tahsil/ode yazarsan açık hatırlatma kendiliğinden kapanır. Sadece hatırlatma isteniyorsa ("Ahmet'in bana 5 bin borcu var, 10 Aralık'ta isteyeceğim") {"op":"add_bill","name":"Ahmet borcunu ödeyecek","dir":"alacak","amount":5000,"due":"...","personName":"Ahmet","category":"Cari"}. Kişi notu için update_person {"personName","note"}.
  Örnekler: "Büşra'ya KMH'den 5 bin gönderdim" → person_tx gonder accountId VakıfBank KMH. "Ahmet'e Ziraat'ten 20 bin borç verdim, 30 Kasım'da geri verecek" → person_tx borc_ver + due. "Mehmet'ten 10 bin borç aldım kasaya, 15 Aralık'ta ödeyeceğim" → person_tx borc_al accountId kasa + due. "Ahmet 20 bini geri verdi, KMH'ye yatırdı" → person_tx tahsil.
- YENİ GELİR/GİDER KAYNAĞI (ev, daire, dükkan, arsa, araç, işletme, sera, proje…): kullanıcı yeni bir şey edindiğini ya da başlattığını anlatırsa önce {"op":"add_unit","name":"Kadıköy daire","type":"ev|dukkan|isyeri|arac|arsa|proje|diger","note":"kiracı, abone no…"} yaz; sonra ona ait her kalemi aynı yanıtta "unitName":"Kadıköy daire" alanıyla ekle (add_recurring: kira geliri, aidat, kredi; add_bill: son ödemeli elektrik/su/doğalgaz/vergi; add: tek seferlik tadilat, eşya, sigorta). Değişken faturalar (elektrik, su, doğalgaz) için add_recurring "variable":true. Mevcut bir kaydı mülke bağlamak için {"op":"assign_unit","unitName":"...","recurringId"|"billId"|"txId":"..."}; mülk bilgisi değişirse update_unit.
  Örnek: "Kadıköy'de daire aldım, kiraya verdim, kira her ayın 1'i 25 bin İş Bankası KMH'ye yatacak, aidatı her ayın 10'u 1.500 kasadan, elektriği değişken ben ödüyorum her ayın 20'si" → add_unit + add_recurring(gelir 25000 gün 1 accountId İş KMH unitName) + add_recurring(gider 1500 gün 10 unitName) + add_recurring(gider variable gün 20 unitName).
- ÖĞRENME: kullanıcı kalıcı bir tercih/kural söylerse ("bundan sonra…", "her zaman…", "unutma…", "X dediğimde Y'yi kastediyorum", "şu kartı artık kullanmıyorum") ilgili işlemi yap ve ayrıca {"op":"remember","text":"kısa, açık kural"} ekle. Kullanıcı "şunu unut" derse {"op":"forget","memoryId":"..."}. KULLANICININ ÖĞRETTİKLERİ listesindeki kurallar bu yönergenin genel kurallarından önce gelir.
- Listede olmayan bir kategori gerekirse {"op":"add_category","name":"..."} ekleyip aynı yanıtta o kategoriyi kullan.
- BİLİNMEYEN DURUMLAR: Hiçbir işleme tam uymayan bir şey anlatılırsa en yakın işlemlerle kaydet (sabit kalem, fatura/alacak, hareket, mülk) ve reply'da nasıl kaydettiğini bir cümleyle söyle. Tutar, tarih ya da hesap gerçekten belirsizse tahmin etme; actions boş bırakıp kısa ve net soru sor.
- "Neler yapabilirsin / nasıl kullanırım" sorulursa yeteneklerini kısa maddelerle anlat: harcama-ödeme kaydı, kart/KMH faizi ve asgari, krediler, sabit gelir-gider ve zam, faturalar ve alacaklar, maaş ve puantaj, otel cari ve elektrik, mülk/proje takibi, aktarım, düzeltme-silme, kural öğretme, yedek.
- Soru sorulursa actions boş olsun; reply'da rakamlarla kısa, net yanıt ver (tutarları 1.234,56 ₺ biçiminde yaz).
- Yatırım tavsiyesi verme. Hangi borcu önce kapatmanın faizi azalttığı gibi genel hesap bilgisi verebilirsin.
- reply kısa olsun (1-3 cümle), kaydettiklerini tek tek tekrar sayma; kayıtlar ayrıca gösterilecek.

Yalnızca şu biçimde JSON döndür:
{"reply":"...","actions":[{"op":"add","accountId":"...","kind":"harcama","amount":450,"date":"${iso(T)}","installments":1,"desc":"Migros","category":"Market"}]}

KULLANICI MESAJI:
${text}`;

function mapKind(kind, type) {
  const k = String(kind || "");
  if (type === "kredi") return "odeme";
  if (type === "nakit") return ["gelir", "yatirma", "odeme", "iade"].includes(k) ? "gelir" : "gider";
  if (type === "kmh") return ["yatirma", "odeme", "iade", "gelir"].includes(k) ? "yatirma" : k === "faiz" ? "faiz" : "cekim";
  return k === "cekim" ? "nakit" : k === "yatirma" || k === "gelir" ? "odeme" : "harcama";
}

// istenen ada en yakın modeli seç (ör. "gemini-3.1-pro" → "gemini-3.1-pro-preview"); ad yoksa en yeni flash
