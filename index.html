  else if (/borcumu/.test(s)) pk = "ode";
  else if (/borcunu|geri (verdi|odedi|gonderdi|yatirdi)/.test(s)) pk = "tahsil";
  else if (/(dan|den|tan|ten)$/.test(tok) || /(gonderdi|yolladi|geldi|odedi|yatirdi)/.test(s)) pk = "al";
  const due = /(verecek|odeyecek|odeyecegim|verecegim|vade|geri )/.test(s) && (pk === "borc_ver" || pk === "borc_al") ? parseDue(s) : null;
  const rest = toks.filter(w => w !== tok).join(" ");
  let acc = matchAccount(rest); if (acc && acc.type === "kredi") acc = null;
  if (!acc && /kasa|elden|nakit/.test(s)) acc = S.accounts.find(a => a.type === "nakit") || null;
  const th = typeHint(rest);
  if (!acc && (th === "kmh" || th === "kart") && S.accounts.filter(a => a.type === th).length > 1) return {reply:`Hangi ${th === "kmh" ? "KMH" : "kart"}? Bankayı da söyler misiniz (örn. “VakıfBank KMH'den”).`, actions:[]};
  const amount = parseAmount(s, acc);
  if (!(amount > 0)) return {reply:who + " için tutarı da yazar mısınız?", actions:[]};
  const date = due ? iso(today()) : parseDate(s);
  return {reply:`${who}: ${PKIND[pk].toLowerCase()} ${money(amount)}${acc ? " · " + accName(acc) : " · hesap dışı"}${due ? " · " + fmtD(parseISO(due)) + " günü hatırlatılacak" : ""}.`,
    actions:[{op:"person_tx", personName:who, pkind:pk, accountId:acc ? acc.id : null, amount, date, due}]};
}
// düzeltme / silme / zam / aktarım (Claude yokken)
function localEdit(text) {
  const s = norm(text), T = today();
  const latest = () => S.tx.slice().sort((a, b) => (b.created || 0) - (a.created || 0))[0];
  if (/(son|az onceki|en son|sonuncu)\w*\s*(islem|hareket|kayit|harcama|odeme)?\w*\s*(sil|iptal)|sil(?:.*)(son|az onceki) (islem|hareket|kayit)/.test(s)) {
    const t = latest(); if (!t) return {reply:"Silinecek hareket yok.", actions:[]};
    return {reply:`Son hareket silindi: ${t.desc || KIND[t.kind]} · ${money(t.amount)}.`, actions:[{op:"delete", txId:t.id}]};
  }
  if (/(son|az onceki|en son)\w*\s*(islem|hareket|kayit)\w*/.test(s) && /(duzelt|olacak|olmali|yap|degistir)/.test(s)) {
    const t = latest(), amount = parseAmount(s, null); if (!t || !(amount > 0)) return null;
    return {reply:`Son hareketin tutarı ${money(amount)} olarak düzeltildi.`, actions:[{op:"edit_tx", txId:t.id, amount}]};
  }
  // tekrarlayan kalemde zam / tek ay değişikliği / atlama
  const r = S.recurring.find(r => norm(r.name).split(/\s+/).some(w => w.length >= 3 && !STOP.includes(w) && new RegExp("(^|[^a-z0-9])" + reEsc(w)).test(s)));
  if (r && /(zam|artis|artir|indirim|dusur|yeni tutar|itibaren|gelmeyecek|odenmeyecek|atla|iptal)/.test(s)) {
    if (/gelmeyecek|odenmeyecek|atla|iptal/.test(s)) {
      const mn = s.match(new RegExp("\\b(" + MONTHS.join("|") + ")")), per = mn ? ym(new Date(T.getFullYear() + (MONTHS.indexOf(mn[1]) < T.getMonth() - 1 ? 1 : 0), MONTHS.indexOf(mn[1]), 1)) : ym(T);
      return {reply:`${r.name} ${ymLabel(per)} ayı atlandı.`, actions:[{op:"recurring_override", recurringId:r.id, period:per, skip:true}]};
    }
    const idx = s.match(/(\d+)\s*\.?\s*(ay|aydan|ayinda|ayda)/), mn = s.match(new RegExp("\\b(" + MONTHS.join("|") + ")"));
    let cleaned = s; if (idx) cleaned = cleaned.replace(idx[0], " ");
    const amount = parseAmount(cleaned, null);
    if (!(amount > 0)) return {reply:`${r.name} için yeni tutarı da yazar mısınız?`, actions:[]};
    const a = {op:"recurring_change", recurringId:r.id, amount};
    if (idx) a.fromIndex = +idx[1];
    else if (mn) { let d = new Date(T.getFullYear(), MONTHS.indexOf(mn[1]), 1); if (d < new Date(T.getFullYear(), T.getMonth() - 6, 1)) d = new Date(T.getFullYear() + 1, MONTHS.indexOf(mn[1]), 1); a.fromPeriod = ym(d); }
    else a.fromPeriod = ym(T);
    return {reply:`${r.name} için tutar ${a.fromIndex ? a.fromIndex + ". aydan" : ymLabel(a.fromPeriod) + "'dan"} itibaren ${money(amount)} olarak kaydedildi.`, actions:[a]};
  }
  // hesaplar arası aktarım: "X'den ... Y ... ödedim/yatırdım/aktardım"
  if (/odedim|yatirdim|aktardim|gonderdim|kapattim|cektim/.test(s)) {
    const m = s.match(/^(.*?)(?:'|’)?(?:dan|den|tan|ten)\b(.*)$/);
    if (m) {
      const from = matchAccount(m[1]), to = matchAccount(m[2]);
      if (from && to && from.id !== to.id && from.type !== "kredi") {
        let amount = parseAmount(s, null);
        if (!(amount > 0) && to.type === "kart") amount = cardCalc(to, T).stmt;
        if (!(amount > 0)) return {reply:"Aktarılan tutarı da yazar mısınız?", actions:[]};
        return {reply:`${accName(from)} → ${accName(to)} aktarımı kaydedildi.`, actions:[{op:"transfer", fromAccountId:from.id, toAccountId:to.id, amount, date:parseDate(s)}]};
      }
    }
  }
  return null;
}
const HELP = "Yapabildiklerim:\n• Harcama, ödeme, nakit avans, puan: “Garanti karttan 450 market”, “kartıma 5 bin ödedim”\n• KMH: “KMH'den 2 bin kullandım”, “KMH'ye 3 bin ekledim”\n• Aktarım: “Ziraat KMH'den Garanti kart borcunu ödedim”\n• Sabit gelir/gider ve zam: “Her ayın 5'i dükkan kirası 25 bin, 1 yıl”, “6. aydan itibaren 30 bin”\n• Kişiler: “Büşra'ya KMH'den 5 bin gönderdim”, “Ahmet'e 20 bin borç verdim, 30 Kasım'da verecek”\n• Fatura ve alacak: “Su faturası 500 TL son ödeme 16'sı”, “Ahmet'ten 20 bin alacağım vade 30 Kasım”\n• Maaş: “Bugün işe gitmedim”, “3 saat mesai yaptım”\n• Otel: “Ekim ZES faturası…”, “Otelden 50 bin geldi”\n• Yeni mülk/proje: “Kadıköy'de daire aldım, kirası…”\n• Düzeltme: “Son işlemi sil”, “tutarı 1.250 olacak”\n• Öğretme: “Bundan sonra annemin kartı deyince Ziraat başak kartı anla”";
function localLearn(text) {
  const s = norm(text);
  if (/neler yapabilir|ne yapabilirsin|nasil kullan|yardim\b|komutlar/.test(s)) return {reply:HELP, actions:[]};
  if (/^(bundan sonra|bundan boyle|unutma|aklinda tut|hatirla|ogren)\b|her zaman .*(anla|kullan|yaz)|dedigimde|deyince .* anla/.test(s)) return {reply:"Not aldım, bundan sonra buna göre davranacağım.", actions:[{op:"remember", text:text.trim()}]};
  const um = s.match(/(?:yeni )?(daire|ev|dukkan|arsa|tarla|arac|araba|isyeri|sera|proje)\w*\s+(aldim|actim|kiraladim|baslattim|edindim|kurdum)/);
  if (um && !/\d/.test(s)) { const type = {daire:"ev", ev:"ev", dukkan:"dukkan", arsa:"arsa", tarla:"arsa", arac:"arac", araba:"arac", isyeri:"isyeri", sera:"isyeri", proje:"proje"}[um[1]];
    return {reply:"Yeni mülk eklendi. Kira, aidat, fatura gibi kalemlerini anlatırsanız bu mülke bağlarım.", actions:[{op:"add_unit", name:text.replace(/\s*(aldım|açtım|kiraladım|başlattım|edindim|kurdum).*$/i, "").trim().slice(0, 50) || "Yeni mülk", type}]}; }
  return null;
}
function localParse(text) {
  const lr = localLearn(text);
  if (lr) return lr;
  const pp = localPerson(text);
  if (pp) return pp;
  const ed = localEdit(text);
  if (ed) return ed;
  const bill = localBill(text);
  if (bill) return bill;
  const hot = localHotel(text);
  if (hot) return hot;
  const att = localAttendance(text);
  if (att) return att;
  const rec = localRecurring(text);
  if (rec) return rec;
  // tutarı olmayan parçayı ("…, KMH'ye yatır") tutarlı parçayla birleştir
  const hasAmt = g => parseAmount(norm(g), null) > 0;
  const segs = [];
  for (const g of text.split(/\s*(?:;|\n|,\s+(?=\D)|\s+ve\s+|\s+sonra\s+|\s+bir de\s+)\s*/i).filter(Boolean)) {
    if (segs.length && (!hasAmt(g) || !hasAmt(segs[segs.length - 1]))) segs[segs.length - 1] += " " + g; else segs.push(g);
  }
  const actions = []; let prev = null; const problems = [];
  const whole = norm(text);
  for (const seg of segs) {
    const s = norm(seg);
    let acc = matchAccount(s) || prev;
    let amount = parseAmount(s, acc);
    if (!acc && segs.length === 1) acc = matchAccount(whole);
    if (!acc && !(amount > 0)) continue;
    if (!acc) { problems.push("“" + seg + "” için hesabı bulamadım"); continue; }
    prev = acc;
    const kind = kindFor(s, acc.type);
    if (!(amount > 0) && acc.type === "kredi") amount = loanCalc(acc, today()).A;
    if (!(amount > 0)) { problems.push("“" + seg + "” için tutarı bulamadım"); continue; }
    const im = s.match(/(\d+)\s*taksit/);
    let desc = seg.replace(/\s+/g, " ").trim(); if (desc.length > 60) desc = desc.slice(0, 60) + "…";
    actions.push({op:"add", accountId:acc.id, kind, amount, date:parseDate(s), installments:im ? +im[1] : 1, desc:desc.charAt(0).toLocaleUpperCase("tr") + desc.slice(1), category:DEBIT.has(kind) ? catFor(s) : ""});
  }
  let reply;
  if (actions.length) reply = actions.length === 1 ? "Kaydettim." : actions.length + " işlemi kaydettim.";
  else if (/\?|ne kadar|kac|toplam|faiz/.test(whole)) {
    const C = computeAll();
    reply = `Toplam borcunuz ${money(C.debt)}. Önümüzdeki 30 günde ${money(C.due30)} ödemeniz var. KMH ve kredilerin aylık faiz yükü yaklaşık ${money(C.monthInt)}` + (C.riskInt > 1 ? `; kartlarda yalnız asgari öderseniz buna ${money(C.riskInt)} eklenir.` : ".");
  } else reply = "Hangi hesap ve ne kadar olduğunu anlayamadım. Örneğin “Garanti kartla 450 TL market” gibi yazabilirsiniz.";
  if (problems.length) reply += " " + problems.join("; ") + ". Banka adını ya da kartın son 4 hanesini ekleyip tekrar yazın.";
  return {reply, actions};
}

initStore();
